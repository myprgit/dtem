# dtem config — ~/.config/dtem/dtem.toml
# Every key is optional. Changes are applied live. Easiest way to edit: the settings page
# (kitty_mod+F2 or ctrl+, inside dtem, or `dtem --settings`). Import tilda: `dtem --import-tilda`.

# ---- look
font_family = "monospace"        # fontconfig name or a font file path
font_size = 11.0
line_height = 1.0
padding = 4.0
ligatures = true
color_scheme = "tokyo-night"     # tokyo-night tango white-on-black green-on-black black-on-white linux xterm
                                 # rxvt zenburn solarized-dark solarized-light snazzy dracula gruvbox-dark
                                 # nord catppuccin-mocha one-dark
transparency = false             # toggle live with the `toggle_transparency` action
background_opacity = 0.85
cursor_shape = "block"           # block | beam | underline
cursor_blink = false
bold_is_bright = false
scrollbar = "none"               # none | right | left

# ---- tabs & titles
tab_bar_min_tabs = 2             # 1 = always show the tab bar
tab_bar_position = "top"         # top | bottom | hidden
tab_bar_expand = false
new_tab_after_current = true
title = "dtem"
dynamic_title = "replace"        # replace | before | after | none
title_max_length = 0             # 0 = unlimited
title_truncate = "end"           # end | start | none

# ---- scrolling, selection, links
scrollback_lines = 10000
scrollback_infinite = false
scroll_on_output = false
scroll_on_key = true
word_chars = ""                  # e.g. "-A-Za-z0-9,./?%&#:_" (empty = default)
copy_on_select = false
open_url_with = "xdg-open"
url_requires_ctrl = true
match_web_uris = true
match_file_uris = true
match_email = true

# ---- keyboard
backspace_sends = "auto"         # auto | del | bs | escape
delete_sends = "escape"          # escape | del | bs | auto
ime = true
kitty_keyboard = true
kitty_mod = "ctrl+shift"

# ---- shell
# shell = "/usr/bin/zsh"
command = ""                     # run in new tabs
command_exit = "shell"           # shell | restart | close
login_shell = false
working_dir = ""
inherit_working_dir = true

# ---- bell & notifications
bell = true
visual_bell = false
tab_activity_markers = true      # ● unseen output, 🔔 bell, ✗ failed command
notify_on_bell = true            # desktop notification for bells in tabs you aren't looking at
notify_command_seconds = 10      # notify when a long command finishes unseen (0 = off)
notify_programs = true           # OSC 9 / OSC 777 notifications from programs
shell_integration = true         # bash/zsh/fish: prompt jumps, copy last output, remote cwd

# ---- session (restart / reboot)
persist_scrollback = true
persist_scrollback_lines = 10000
autosave_interval_secs = 5

# ---- misc
force_x11 = false                # Wayland: run normal windows via XWayland (restores positions)
clipboard_read = "ask"           # OSC 52 reads by programs: ask | allow | deny
remote_install_helpers = true

[confirm_close]
tab = true
pane = true
window = true                    # also offers "quit without saving"
on_exit = true                   # ask when a shell exits by itself (exit / Ctrl+D)

[dropdown]
hotkey = "F12"                   # or a list: ["F1", "ctrl+alt+t"]
width = 1.0
height = 0.45
centered_horizontally = true
centered_vertically = false
x = 0
y = 0
monitor = ""                     # first-time monitor (e.g. "DP-1"); then the last used one is remembered
animation = false
animation_duration_ms = 180
animation_from = "top"           # top | bottom | left | right
hide_on_focus_loss = false
hide_on_mouse_leave = false
auto_hide_delay_ms = 0
unfocused_toggle = "focus"       # hotkey while visible but unfocused: focus | hide
grab_focus = true
always_on_top = true
skip_taskbar = true
all_workspaces = true
start_hidden = false
start_fullscreen = false
on_last_tab_exit = "new_tab_hide"  # new_tab_hide | new_tab | quit
desktop_animation = false        # GNOME open/close animation (restart the dropdown)
# color_scheme = "dracula"       # per-dropdown overrides
# font_size = 12.0

# A second dropdown with its own hotkey, size, colors and tabs:
# [dropdowns.2]
# hotkey = "shift+F1"
# height = 0.6
# color_scheme = "dracula"

# Colors override the scheme (all optional):
[colors]
# foreground = "#dddddd"
# background = "#1a1b26"
# cursor = "#c0caf5"
# palette = ["#15161e", "#f7768e", ...16 colors]

# "combo" = "action"; "none" removes a default binding
[keybindings]
# "ctrl+shift+f" = "search"
# "f12" = "toggle_transparency"
