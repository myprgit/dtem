[package]
name = "dtem"
version = "0.1.0"
edition = "2024"
description = "GPU accelerated terminal with dropdown mode, splits, session restore and ssh clipboard sync"
authors = ["Mehmet Yapar <mehmetyapar@windowslive.com>"]
license = "Apache-2.0"
repository = "https://github.com/myprgit/dtem"

[package.metadata.deb]
section = "x11"
priority = "optional"
depends = "libc6 (>= 2.30)"
recommends = "fontconfig, xdg-utils"
extended-description = """dtem is a GPU accelerated terminal emulator: tabs and split panes, a dropdown
mode bound to a global hotkey, full session restore across reboots, kitty-style key
bindings, ligatures, images (kitty graphics protocol), shell integration and ssh with
clipboard/image sync. After installing, every user runs `dtem --install` once."""
maintainer-scripts = "packaging/"
assets = [
    ["target/release/dtem", "usr/bin/", "755"],
    ["packaging/dtem.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/dtem/README.md", "644"],
    ["dtem.example.toml", "usr/share/doc/dtem/dtem.example.toml", "644"],
    ["assets/fonts/JetBrainsMono-OFL.txt", "usr/share/doc/dtem/licenses/JetBrainsMono-OFL.txt", "644"],
    ["packaging/blesh-LICENSE.md", "usr/share/doc/dtem/licenses/blesh-LICENSE.md", "644"],
]

[profile.release]
strip = true

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
copypasta = "0.10.2"
dirs = "7.0.0"
env_logger = "0.11.11"
flate2 = "1.1.11"
global-hotkey = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2.191"
log = "0.4.35"
notify-rust = "4.19.0"
parking_lot = "0.12"
polling = "3.8"
pollster = "1.0.1"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
swash = "0.2.10"
tar = "0.4.46"
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-width = "0.2.3"
wgpu = "30.0.1"
winit = "0.30.13"
x11rb = "0.14.0"
