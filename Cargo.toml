[package]
name = "dtem"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
arboard = "3.7.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
copypasta = "0.10.2"
dirs = "7.0.0"
env_logger = "0.11.11"
global-hotkey = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2.191"
log = "0.4.35"
pollster = "1.0.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
swash = "0.2.10"
toml = "1.2.1"
unicode-width = "0.2.3"
wgpu = "30.0.1"
winit = "0.30.13"
